<!DOCTYPE html>
<html lang="sw">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
	<title id="page-title">{{ site_label or "Wi-Fi" }} - Ungana Sasa</title>
	<style>
		:root {
			/* Coffee palette: espresso / coffee / mocha / latte / cream. */
			--espresso: #1F120B;
			--coffee: #3A2010;
			--mocha: #98745A;
			--latte: #EBE0D2;
			--cream: #FAF6F3;

			--surface: #FFFDFB;
			--surface-2: var(--cream);
			--line: #E4D7C7;
			--text: var(--espresso);
			--text-dim: #6E4F39;
			--text-faint: #8A6B55;
			--btn-bg: linear-gradient(135deg, #4A2A16 0%, var(--coffee) 55%, var(--espresso) 100%);
			--btn-text: var(--cream);
			--shadow-coffee: 0 10px 24px -8px rgba(58, 32, 16, 0.45);

			--danger-bg: #FBEDEA;
			--danger-text: #9A2F1F;
			--danger-border: #EBC2B8;
			--success-bg: #F0EEDF;
			--success-text: #4C5A23;
			--success-border: #CFD3A8;

			--ease-out: cubic-bezier(0.22, 1, 0.36, 1);
			--ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
			--serif: Georgia, "Noto Serif", "Times New Roman", serif;
		}
		* { box-sizing: border-box; margin: 0; padding: 0; }
		html, body { height: 100%; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			min-height: 100vh;
			display: flex;
			justify-content: center;
			/* bottom room so the stacked call/chat/lipa buttons never cover content */
			padding: 24px 14px 150px;
			color: var(--text);
			background:
				radial-gradient(120% 60% at 100% 0%, rgba(152, 116, 90, 0.18) 0%, transparent 60%),
				radial-gradient(90% 50% at 0% 100%, rgba(235, 224, 210, 0.9) 0%, transparent 70%),
				var(--cream);
			-webkit-tap-highlight-color: transparent;
		}
		/* Vue mount point (public/js/wifi_portal) -- stands in for .page as body's flex child */
		#portal { width: 100%; display: flex; justify-content: center; }
		.page { width: 100%; max-width: 430px; }

		/* ---- Motion ---------------------------------------------------- */
		@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
		@keyframes pop { 0% { opacity: 0; transform: scale(0.6); } 100% { opacity: 1; transform: scale(1); } }
		@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
		@keyframes ripple {
			0% { box-shadow: 0 0 0 0 rgba(235, 224, 210, 0.55), 0 12px 28px rgba(0, 0, 0, 0.35); }
			100% { box-shadow: 0 0 0 20px rgba(235, 224, 210, 0), 0 12px 28px rgba(0, 0, 0, 0.35); }
		}
		@keyframes arc { 0%, 20% { opacity: 0.25; } 45%, 80% { opacity: 1; } 100% { opacity: 0.25; } }
		@keyframes drift { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-14px, 10px) scale(1.08); } }
		@keyframes sheen { 0% { transform: translateX(-120%) skewX(-20deg); } 60%, 100% { transform: translateX(260%) skewX(-20deg); } }
		@keyframes pulse-ring {
			0% { box-shadow: var(--shadow-coffee), 0 0 0 0 rgba(152, 116, 90, 0.5); }
			70%, 100% { box-shadow: var(--shadow-coffee), 0 0 0 14px rgba(152, 116, 90, 0); }
		}
		@keyframes draw { to { stroke-dashoffset: 0; } }
		@keyframes slide-down { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
		@keyframes bubble-in { from { opacity: 0; transform: translateY(8px) scale(0.96); } to { opacity: 1; transform: none; } }
		@keyframes tick { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

		/* Staggered page entrance */
		.lang-toggle { animation: rise 0.5s var(--ease-out) both; }
		.card { animation: rise 0.6s var(--ease-out) 0.05s both; }
		.ad-card { animation: rise 0.6s var(--ease-out) 0.18s both; }
		.section { animation: rise 0.6s var(--ease-out) 0.26s both; }
		.footer-note { animation: rise 0.6s var(--ease-out) 0.4s both; }

		/* Language toggle */
		.lang-toggle {
			display: flex;
			justify-content: center;
			margin-bottom: 14px;
		}
		.lang-toggle-inner {
			display: inline-flex;
			background: rgba(255, 253, 251, 0.8);
			border: 1px solid var(--line);
			border-radius: 999px;
			padding: 3px;
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			box-shadow: 0 4px 14px -6px rgba(58, 32, 16, 0.2);
		}
		.lang-btn {
			border: none;
			background: transparent;
			color: var(--text-dim);
			font-size: 12px;
			font-weight: 700;
			letter-spacing: 0.6px;
			padding: 6px 15px;
			border-radius: 999px;
			cursor: pointer;
			transition: background 0.25s var(--ease-out), color 0.25s ease, transform 0.15s ease;
		}
		.lang-btn:active { transform: scale(0.94); }
		.lang-btn.active { background: var(--coffee); color: var(--cream); }

		/* ---- Main card + hero ----------------------------------------- */
		.card {
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 28px;
			padding: 0 22px 22px;
			text-align: center;
			overflow: hidden;
			box-shadow: 0 24px 48px -24px rgba(31, 18, 11, 0.35), 0 2px 6px rgba(31, 18, 11, 0.05);
		}
		/* Loading / noscript placeholder has no hero */
		.card > .tagline:first-child { padding-top: 26px; }

		.hero {
			position: relative;
			margin: 0 -22px;
			padding: 30px 22px 26px;
			background: linear-gradient(160deg, var(--coffee) 0%, var(--espresso) 75%);
			color: var(--cream);
			overflow: hidden;
			isolation: isolate;
		}
		.hero::before, .hero::after {
			content: "";
			position: absolute;
			border-radius: 50%;
			z-index: -1;
			animation: drift 9s ease-in-out infinite;
		}
		.hero::before {
			width: 220px; height: 220px;
			top: -110px; right: -60px;
			background: radial-gradient(circle, rgba(152, 116, 90, 0.55) 0%, transparent 70%);
		}
		.hero::after {
			width: 180px; height: 180px;
			bottom: -100px; left: -50px;
			background: radial-gradient(circle, rgba(235, 224, 210, 0.18) 0%, transparent 70%);
			animation-delay: -4s;
		}
		.hero-icon {
			width: 68px;
			height: 68px;
			margin: 0 auto 14px;
			border-radius: 50%;
			overflow: hidden;
			background: linear-gradient(145deg, var(--mocha), #6E4F39);
			border: 2px solid rgba(235, 224, 210, 0.35);
			display: flex;
			align-items: center;
			justify-content: center;
			animation: pop 0.6s var(--ease-spring) 0.15s both, ripple 2.4s ease-out 0.8s infinite;
		}
		.hero-icon svg { width: 32px; height: 32px; animation: float 3.2s ease-in-out infinite; }
		.hero-icon svg path:nth-child(2) { animation: arc 2.4s ease-in-out infinite; }
		.hero-icon svg path:nth-child(3) { animation: arc 2.4s ease-in-out 0.2s infinite; }
		.hero-icon svg path:nth-child(4) { animation: arc 2.4s ease-in-out 0.4s infinite; }
		.hero-icon img { width: 100%; height: 100%; object-fit: cover; }
		.hero h1 {
			font-family: var(--serif);
			font-size: 24px;
			font-weight: 700;
			letter-spacing: 0.2px;
			color: var(--cream);
			animation: rise 0.6s var(--ease-out) 0.25s both;
		}
		.card p.tagline { font-size: 12.5px; color: var(--text-dim); margin-top: 4px; }
		.hero p.tagline { color: var(--latte); opacity: 0.9; animation: rise 0.6s var(--ease-out) 0.32s both; }
		.card p.premium-tag {
			display: inline-block;
			font-size: 10.5px;
			font-weight: 700;
			color: var(--latte);
			margin-top: 10px;
			padding: 4px 12px;
			border: 1px solid rgba(235, 224, 210, 0.3);
			border-radius: 999px;
			background: rgba(235, 224, 210, 0.08);
			text-transform: uppercase;
			letter-spacing: 1px;
			animation: rise 0.6s var(--ease-out) 0.38s both;
		}

		.steps {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 6px;
			margin: 18px 0 16px;
			font-size: 11.5px;
			font-weight: 700;
			color: var(--coffee);
			letter-spacing: 0.3px;
		}
		.steps > span:not(.chevron) {
			padding: 5px 10px;
			border-radius: 999px;
			background: var(--latte);
			animation: pop 0.45s var(--ease-spring) both;
		}
		.steps > span:nth-of-type(1) { animation-delay: 0.45s; }
		.steps > span:nth-of-type(3) { animation-delay: 0.55s; }
		.steps > span:nth-of-type(5) { animation-delay: 0.65s; }
		.steps .chevron { color: var(--mocha); font-size: 13px; }

		/* Prominent voucher input */
		.voucher-hero {
			text-align: left;
			margin-top: 6px;
		}
		.voucher-input-wrap {
			display: flex;
			align-items: center;
			gap: 10px;
			background: var(--surface-2);
			border: 1.5px solid var(--line);
			border-radius: 16px;
			padding: 14px 16px;
			transition: border-color 0.2s ease, box-shadow 0.25s ease, background 0.2s ease;
		}
		.voucher-input-wrap:focus-within {
			border-color: var(--mocha);
			background: #fff;
			box-shadow: 0 0 0 4px rgba(152, 116, 90, 0.18);
		}
		.voucher-input-wrap svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--mocha); }
		.voucher-input-wrap input {
			flex: 1;
			background: transparent;
			border: none;
			outline: none;
			color: var(--coffee);
			font-size: 15px;
			font-weight: 700;
			letter-spacing: 1px;
			text-transform: uppercase;
			min-width: 0;
		}
		.voucher-input-wrap input::placeholder {
			color: var(--text-faint);
			font-weight: 500;
			text-transform: none;
			letter-spacing: normal;
		}

		/* Buttons share a press effect and a light sheen sweep */
		.btn-primary, .buy-btn, .modal-submit, .free-trial-btn, .fab-lipa {
			position: relative;
			overflow: hidden;
			transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.2s ease;
		}
		.btn-primary::after, .modal-submit::after, .fab-lipa::after {
			content: "";
			position: absolute;
			top: 0; bottom: 0; left: 0;
			width: 40%;
			background: linear-gradient(90deg, transparent, rgba(250, 246, 243, 0.25), transparent);
			transform: translateX(-120%) skewX(-20deg);
			animation: sheen 3.6s ease-in-out 1.2s infinite;
			pointer-events: none;
		}
		.btn-primary:active:not(:disabled), .buy-btn:active:not(:disabled),
		.modal-submit:active:not(:disabled), .free-trial-btn:active:not(:disabled) { transform: scale(0.97); }
		.btn-primary:hover:not(:disabled), .modal-submit:hover:not(:disabled) { filter: brightness(1.12); }

		.btn-primary {
			width: 100%;
			margin-top: 12px;
			padding: 14px;
			border: none;
			border-radius: 14px;
			background: var(--btn-bg);
			color: var(--btn-text);
			font-size: 15px;
			font-weight: 800;
			letter-spacing: 0.3px;
			cursor: pointer;
			box-shadow: var(--shadow-coffee);
		}
		.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

		.btn-secondary {
			width: 100%;
			margin-top: 10px;
			padding: 12px;
			border: 1.5px solid var(--line);
			border-radius: 14px;
			background: transparent;
			color: var(--coffee);
			font-size: 13.5px;
			font-weight: 700;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
		}
		.btn-secondary:hover { background: var(--cream); border-color: var(--mocha); }
		.btn-secondary:active { transform: scale(0.98); }
		.btn-secondary svg { width: 16px; height: 16px; color: var(--mocha); }

		.pay-label {
			font-size: 10.5px;
			font-weight: 700;
			color: var(--text-faint);
			text-transform: uppercase;
			letter-spacing: 1px;
			margin: 20px 0 10px;
			display: flex;
			align-items: center;
			gap: 10px;
		}
		.pay-label::before, .pay-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
		.pay-logos {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			justify-content: center;
		}
		.pay-logo {
			height: 34px;
			padding: 5px 12px;
			border: 1px solid var(--line);
			border-radius: 10px;
			background: #FFFFFF;
			display: flex;
			align-items: center;
			justify-content: center;
			animation: pop 0.4s var(--ease-spring) both;
			transition: transform 0.2s var(--ease-out), box-shadow 0.2s ease;
		}
		.pay-logo:nth-child(1) { animation-delay: 0.5s; }
		.pay-logo:nth-child(2) { animation-delay: 0.56s; }
		.pay-logo:nth-child(3) { animation-delay: 0.62s; }
		.pay-logo:nth-child(4) { animation-delay: 0.68s; }
		.pay-logo:nth-child(n+5) { animation-delay: 0.74s; }
		.pay-logo:hover { transform: translateY(-2px); box-shadow: 0 6px 14px -6px rgba(58, 32, 16, 0.3); }
		.pay-logo img { max-height: 22px; max-width: 80px; object-fit: contain; }
		.pay-logo .pay-fallback {
			display: none;
			align-items: center;
			font-size: 10.5px;
			font-weight: 800;
			color: var(--text);
			white-space: nowrap;
		}

		/* ---- Ads -------------------------------------------------------- */
		.ad-card {
			margin-top: 16px;
			border: 1px solid var(--line);
			border-radius: 20px;
			overflow: hidden;
			background: var(--surface);
			box-shadow: 0 12px 28px -18px rgba(31, 18, 11, 0.35);
		}
		.ad-image-wrap {
			display: flex;
			align-items: center;
			justify-content: center;
			height: 88px;
			background: var(--surface-2);
			padding: 10px;
		}
		.ad-banner {
			display: block;
			max-width: 100%;
			max-height: 100%;
			width: auto;
			height: auto;
			object-fit: contain;
		}
		.ad-marquee {
			overflow: hidden;
			white-space: nowrap;
			border-top: 1px solid var(--line);
			background: var(--coffee);
			padding: 7px 0;
		}
		.ad-marquee-track {
			display: inline-flex;
			width: max-content;
			animation-name: ad-marquee-scroll;
			animation-timing-function: linear;
			animation-iteration-count: infinite;
		}
		.ad-marquee-item {
			display: inline-block;
			padding: 0 20px;
			font-size: 12px;
			font-weight: 600;
			color: var(--latte);
		}
		@keyframes ad-marquee-scroll {
			from { transform: translateX(0); }
			to { transform: translateX(-50%); }
		}

		/* Carousel: every slide shares the same grid cell (stacked on top of
		   one another) so the container's height never jumps between ads,
		   and the active one is swapped purely via an opacity crossfade. */
		.ad-slides { display: grid; }
		.ad-slide {
			grid-area: 1 / 1;
			opacity: 0;
			pointer-events: none;
			transform: scale(1.02);
			transition: opacity 0.8s ease-in-out, transform 1.2s var(--ease-out);
		}
		.ad-slide.active { opacity: 1; pointer-events: auto; transform: none; }

		.ad-dots {
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 6px;
			padding: 9px 0;
			background: var(--surface);
			border-top: 1px solid var(--line);
		}
		.ad-dot {
			width: 6px;
			height: 6px;
			border-radius: 50%;
			background: var(--latte);
			border: none;
			padding: 0;
			cursor: pointer;
			transition: width 0.3s var(--ease-out), border-radius 0.3s ease, background 0.3s ease;
		}
		.ad-dot.active { width: 18px; border-radius: 4px; background: var(--mocha); }

		.section { margin-top: 22px; }

		/* ---- Free trial ------------------------------------------------- */
		.free-trial-card {
			display: flex;
			align-items: center;
			gap: 12px;
			background: linear-gradient(135deg, var(--latte) 0%, var(--cream) 100%);
			border: 1.5px solid #DCCAB4;
			border-radius: 18px;
			padding: 14px 16px;
			margin-bottom: 14px;
			text-align: left;
			animation: rise 0.55s var(--ease-out) 0.5s both;
		}
		.free-trial-card.used {
			background: var(--surface-2);
			border-color: var(--line);
		}
		.free-trial-icon {
			flex-shrink: 0;
			width: 42px;
			height: 42px;
			border-radius: 50%;
			background: var(--coffee);
			display: flex;
			align-items: center;
			justify-content: center;
			color: var(--latte);
			box-shadow: 0 6px 14px -6px rgba(58, 32, 16, 0.6);
		}
		.free-trial-card.used .free-trial-icon { background: var(--latte); color: var(--text-dim); box-shadow: none; }
		.free-trial-icon svg { width: 20px; height: 20px; }
		/* the clock hand ticks round */
		.free-trial-card:not(.used) .free-trial-icon svg path:nth-child(2) {
			transform-origin: 12px 12px;
			animation: tick 6s linear infinite;
		}
		.free-trial-text { flex: 1; min-width: 0; text-align: left; }
		.free-trial-title { font-size: 13.5px; font-weight: 800; color: var(--text); }
		.free-trial-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
		.free-trial-btn {
			flex-shrink: 0;
			border: none;
			border-radius: 12px;
			background: var(--btn-bg);
			color: var(--btn-text);
			font-size: 12.5px;
			font-weight: 800;
			padding: 10px 14px;
			cursor: pointer;
			box-shadow: var(--shadow-coffee);
		}
		.free-trial-btn:disabled { opacity: 0.6; cursor: not-allowed; }
		.free-trial-used-badge {
			flex-shrink: 0;
			font-size: 10.5px;
			font-weight: 800;
			color: var(--text-faint);
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 999px;
			padding: 6px 12px;
			text-transform: uppercase;
			letter-spacing: 0.3px;
		}

		/* ---- Sabbath ---------------------------------------------------- */
		.sabbath-card {
			background: linear-gradient(160deg, var(--cream) 0%, var(--latte) 100%);
			border: 1.5px solid #DCCAB4;
			border-radius: 20px;
			padding: 22px 18px 18px;
			margin: 18px 0 14px;
			text-align: center;
			color: var(--coffee);
			box-shadow: 0 10px 26px -14px rgba(58, 32, 16, 0.4);
			animation: rise 0.6s var(--ease-out) 0.45s both;
		}
		.sabbath-icon {
			width: 56px;
			height: 56px;
			margin: 0 auto 10px;
			border-radius: 50%;
			background: linear-gradient(135deg, var(--mocha), var(--coffee));
			color: var(--cream);
			display: flex;
			align-items: center;
			justify-content: center;
			animation: pop 0.6s var(--ease-spring) 0.6s both, pulse-ring 2.6s ease-out 1.2s infinite;
		}
		.sabbath-icon svg { width: 28px; height: 28px; }
		.sabbath-title { font-family: var(--serif); font-size: 20px; font-weight: 700; color: var(--coffee); }
		.sabbath-verse {
			margin: 12px 4px 10px;
			font-size: 15px;
			font-style: italic;
			font-family: var(--serif);
			line-height: 1.5;
			color: var(--coffee);
		}
		.sabbath-verse cite {
			display: block;
			margin-top: 4px;
			font-size: 12px;
			font-style: normal;
			font-weight: 700;
			font-family: inherit;
			color: var(--mocha);
		}
		.sabbath-body { font-size: 12.5px; line-height: 1.5; color: var(--text-dim); }
		.sabbath-connected {
			margin-top: 10px;
			font-size: 12px;
			font-weight: 700;
			color: var(--success-text);
			background: rgba(255, 255, 255, 0.65);
			border-radius: 12px;
			padding: 8px 10px;
		}
		.sabbath-verse-small { margin-top: 10px; font-size: 10.5px; font-style: italic; color: var(--text-faint); }

		/* ---- Packages --------------------------------------------------- */
		.section-card {
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 24px;
			padding: 18px 16px 16px;
			box-shadow: 0 20px 40px -26px rgba(31, 18, 11, 0.4);
		}
		.section-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
			margin-bottom: 14px;
		}
		.section-header .title-group { display: flex; align-items: center; gap: 10px; }
		.section-header .badge {
			width: 30px;
			height: 30px;
			border-radius: 10px;
			background: var(--coffee);
			display: flex;
			align-items: center;
			justify-content: center;
			flex-shrink: 0;
		}
		.section-header .badge svg { width: 15px; height: 15px; color: var(--latte); }
		.section-header h2 { font-family: var(--serif); font-size: 17px; font-weight: 700; color: var(--text); text-align: left; }
		.plans-chip {
			font-size: 10px;
			font-weight: 800;
			color: var(--coffee);
			background: var(--latte);
			border-radius: 999px;
			padding: 5px 10px;
			text-transform: uppercase;
			letter-spacing: 0.6px;
		}

		.group-title {
			font-size: 10.5px;
			font-weight: 700;
			color: var(--text-faint);
			text-transform: uppercase;
			letter-spacing: 1px;
			margin: 16px 0 10px;
			text-align: left;
		}
		.group-title:first-child { margin-top: 0; }

		.plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
		.package-card {
			position: relative;
			overflow: hidden;
			background: linear-gradient(180deg, #fff 0%, var(--cream) 100%);
			border: 1.5px solid var(--line);
			border-radius: 18px;
			padding: 16px 12px 12px;
			text-align: center;
			cursor: pointer;
			animation: rise 0.5s var(--ease-out) both;
			transition: transform 0.3s var(--ease-out), border-color 0.25s ease, box-shadow 0.3s ease;
		}
		/* cards deal in one after another */
		.package-card:nth-child(1) { animation-delay: 0.35s; }
		.package-card:nth-child(2) { animation-delay: 0.42s; }
		.package-card:nth-child(3) { animation-delay: 0.49s; }
		.package-card:nth-child(4) { animation-delay: 0.56s; }
		.package-card:nth-child(5) { animation-delay: 0.63s; }
		.package-card:nth-child(6) { animation-delay: 0.7s; }
		.package-card:nth-child(n+7) { animation-delay: 0.77s; }
		.package-card::before {
			content: "";
			position: absolute;
			top: 0; left: 0; right: 0;
			height: 3px;
			background: linear-gradient(90deg, var(--mocha), var(--coffee));
			transform: scaleX(0);
			transform-origin: left;
			transition: transform 0.35s var(--ease-out);
		}
		.package-card:hover {
			transform: translateY(-4px);
			border-color: var(--mocha);
			box-shadow: 0 16px 28px -16px rgba(58, 32, 16, 0.5);
		}
		.package-card:hover::before { transform: scaleX(1); }
		.package-card:active { transform: translateY(-1px) scale(0.98); }
		.package-info { min-width: 0; }
		.package-name { font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--coffee); }
		.package-meta { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
		.price-tag {
			display: inline-block;
			margin-top: 10px;
			padding: 5px 12px;
			border-radius: 999px;
			background: var(--latte);
			color: var(--coffee);
			font-size: 12px;
			font-weight: 800;
			letter-spacing: 0.2px;
			transition: background 0.25s ease, color 0.25s ease;
		}
		.package-card:hover .price-tag { background: var(--mocha); color: #fff; }
		.buy-btn {
			display: block;
			width: 100%;
			margin-top: 12px;
			border: none;
			background: var(--btn-bg);
			color: var(--btn-text);
			font-size: 13px;
			font-weight: 800;
			padding: 10px 8px;
			border-radius: 12px;
			cursor: pointer;
			box-shadow: 0 6px 14px -8px rgba(58, 32, 16, 0.6);
		}
		.buy-btn:disabled { opacity: 0.6; cursor: not-allowed; }

		.empty-state {
			text-align: center;
			color: var(--text-dim);
			font-size: 13px;
			padding: 16px 10px;
			border: 1.5px dashed var(--line);
			border-radius: 14px;
		}

		.msg {
			margin-top: 16px;
			padding: 12px 14px;
			border-radius: 12px;
			font-size: 13px;
			display: none;
		}
		.msg.show { display: block; animation: slide-down 0.35s var(--ease-out) both; }
		.msg.success { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
		.msg.error { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); }

		.no-site {
			text-align: center;
			color: var(--text-dim);
			font-size: 14px;
			padding: 30px 10px;
		}

		.footer-note {
			text-align: center;
			font-size: 11px;
			color: var(--text-faint);
			margin-top: 26px;
			letter-spacing: 0.3px;
		}

		/* ---- Modals ----------------------------------------------------- */
		.modal-overlay {
			position: fixed;
			inset: 0;
			background: rgba(31, 18, 11, 0.55);
			backdrop-filter: blur(4px);
			-webkit-backdrop-filter: blur(4px);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
			z-index: 1000;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.25s ease;
		}
		.modal-overlay.show { opacity: 1; pointer-events: auto; }
		/* the box springs up as the overlay fades in */
		.modal-overlay > div {
			transform: translateY(24px) scale(0.94);
			transition: transform 0.4s var(--ease-spring);
		}
		.modal-overlay.show > div { transform: none; }
		.modal-box {
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 24px;
			width: 100%;
			max-width: 360px;
			padding: 24px 20px 20px;
			box-shadow: 0 30px 60px -20px rgba(31, 18, 11, 0.5);
			position: relative;
		}
		.modal-close {
			position: absolute;
			top: 12px;
			right: 12px;
			width: 30px;
			height: 30px;
			border-radius: 50%;
			background: var(--latte);
			border: none;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			color: var(--coffee);
			font-size: 18px;
			line-height: 1;
			transition: transform 0.25s var(--ease-out), background 0.2s ease;
		}
		.modal-close:hover { transform: rotate(90deg); background: #E0D0BC; }
		.modal-pkg {
			text-align: center;
			margin: -24px -20px 18px;
			padding: 22px 20px 18px;
			background: linear-gradient(160deg, var(--coffee), var(--espresso));
			border-radius: 24px 24px 0 0;
		}
		.modal-pkg .label {
			font-size: 10.5px;
			font-weight: 700;
			color: var(--mocha);
			text-transform: uppercase;
			letter-spacing: 1px;
		}
		.modal-pkg .name { font-family: var(--serif); font-size: 21px; font-weight: 700; color: var(--cream); margin-top: 4px; }
		.modal-pkg .meta { font-size: 13px; color: var(--latte); margin-top: 2px; }
		.modal-box .modal-close { z-index: 1; background: rgba(235, 224, 210, 0.9); }
		.modal-box label.field-label {
			display: block;
			font-size: 12.5px;
			font-weight: 700;
			color: var(--text-dim);
			margin-bottom: 6px;
			text-align: left;
		}
		.phone-pill {
			display: flex;
			align-items: center;
			gap: 10px;
			background: var(--surface-2);
			border: 1.5px solid var(--line);
			border-radius: 14px;
			padding: 12px 16px;
			transition: border-color 0.2s ease, box-shadow 0.25s ease, background 0.2s ease;
		}
		.phone-pill:focus-within {
			border-color: var(--mocha);
			background: #fff;
			box-shadow: 0 0 0 4px rgba(152, 116, 90, 0.18);
		}
		.phone-pill svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--mocha); }
		.phone-pill input {
			flex: 1;
			background: transparent;
			border: none;
			outline: none;
			color: var(--text);
			font-size: 15px;
			font-weight: 600;
			min-width: 0;
		}
		.phone-pill input::placeholder { color: var(--text-faint); font-weight: 500; }
		.modal-hint {
			font-size: 11.5px;
			color: var(--text-dim);
			margin: 8px 0 16px;
			text-align: left;
		}
		.modal-submit {
			width: 100%;
			padding: 13px;
			border: none;
			border-radius: 14px;
			background: var(--btn-bg);
			color: var(--btn-text);
			font-size: 14.5px;
			font-weight: 800;
			letter-spacing: 0.3px;
			cursor: pointer;
			box-shadow: var(--shadow-coffee);
		}
		.modal-submit:disabled { opacity: 0.6; cursor: not-allowed; }
		.modal-msg {
			margin-top: 12px;
			padding: 10px 12px;
			border-radius: 10px;
			font-size: 12.5px;
			display: none;
		}
		.modal-msg.show { display: block; animation: slide-down 0.35s var(--ease-out) both; }
		.modal-msg.success { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
		.modal-msg.error { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); }
		.modal-info-text { font-size: 13px; color: var(--text-dim); line-height: 1.5; text-align: left; margin-top: 4px; }

		/* ---- Floating buttons ------------------------------------------ */
		.fab-lipa, .fab-chat, .fab-call { animation: pop 0.5s var(--ease-spring) both; }
		.fab-chat { animation-delay: 0.7s; }
		.fab-call { animation-delay: 0.8s; }
		.fab-lipa {
			position: fixed;
			right: 18px;
			bottom: 18px;
			z-index: 900;
			display: flex;
			align-items: center;
			gap: 8px;
			background: var(--btn-bg);
			color: var(--btn-text);
			border: none;
			border-radius: 999px;
			padding: 13px 20px 13px 16px;
			font-size: 13.5px;
			font-weight: 800;
			box-shadow: var(--shadow-coffee);
			cursor: pointer;
			overflow: visible;
			animation: pop 0.5s var(--ease-spring) 0.6s both, pulse-ring 2.8s ease-out 1.5s infinite;
		}
		.fab-lipa::after { border-radius: 999px; }
		.fab-lipa svg { width: 20px; height: 20px; flex-shrink: 0; }

		.fab-chat, .fab-call {
			position: fixed;
			left: 18px;
			z-index: 900;
			width: 52px;
			height: 52px;
			display: flex;
			align-items: center;
			justify-content: center;
			background: var(--surface);
			color: var(--coffee);
			border: 1.5px solid var(--line);
			border-radius: 50%;
			box-shadow: 0 10px 24px -10px rgba(31, 18, 11, 0.45);
			cursor: pointer;
			transition: transform 0.25s var(--ease-out), background 0.2s ease, color 0.2s ease;
		}
		.fab-chat:hover, .fab-call:hover { transform: translateY(-3px); background: var(--coffee); color: var(--cream); }
		.fab-chat:active, .fab-call:active { transform: scale(0.94); }
		.fab-chat { bottom: 18px; }
		.fab-chat svg { width: 24px; height: 24px; }
		.fab-chat .chat-unread-dot {
			position: absolute;
			top: 2px;
			right: 2px;
			width: 12px;
			height: 12px;
			border-radius: 50%;
			background: #C2410C;
			border: 2px solid var(--surface);
			display: none;
		}
		.fab-chat .chat-unread-dot.show { display: block; animation: pop 0.4s var(--ease-spring) both; }

		/* Call-for-help button, stacked directly above the chat button */
		.fab-call { bottom: 82px; text-decoration: none; }
		.fab-call svg { width: 22px; height: 22px; }

		/* ---- Chat ------------------------------------------------------- */
		.chat-box {
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 24px;
			width: 100%;
			max-width: 380px;
			height: min(560px, 80vh);
			padding: 0;
			position: relative;
			box-shadow: 0 30px 60px -20px rgba(31, 18, 11, 0.5);
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}
		.chat-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			padding: 16px 50px 14px 20px;
			background: linear-gradient(160deg, var(--coffee), var(--espresso));
		}
		.chat-header h3 { font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--cream); }
		.chat-header p { font-size: 11px; color: var(--latte); margin-top: 2px; }
		.chat-box .modal-close { top: 14px; right: 14px; background: rgba(235, 224, 210, 0.15); color: var(--cream); }
		.chat-messages {
			flex: 1;
			overflow-y: auto;
			padding: 16px 16px 8px;
			display: flex;
			flex-direction: column;
			gap: 10px;
			background: var(--cream);
		}
		.chat-empty {
			text-align: center;
			color: var(--text-dim);
			font-size: 12.5px;
			margin: auto;
			padding: 20px;
		}
		.chat-bubble {
			max-width: 78%;
			padding: 9px 13px;
			border-radius: 16px;
			font-size: 13px;
			line-height: 1.4;
			word-break: break-word;
			animation: bubble-in 0.3s var(--ease-out) both;
		}
		.chat-bubble.guest {
			align-self: flex-end;
			background: var(--btn-bg);
			color: var(--cream);
			border-bottom-right-radius: 4px;
			transform-origin: bottom right;
		}
		.chat-bubble.admin {
			align-self: flex-start;
			background: var(--surface);
			color: var(--text);
			border: 1px solid var(--line);
			border-bottom-left-radius: 4px;
			transform-origin: bottom left;
		}
		.chat-input-row {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 12px 14px;
			border-top: 1px solid var(--line);
		}
		.chat-input-row input {
			flex: 1;
			background: var(--surface-2);
			border: 1.5px solid var(--line);
			border-radius: 999px;
			padding: 11px 16px;
			color: var(--text);
			font-size: 13.5px;
			outline: none;
			min-width: 0;
			transition: border-color 0.2s ease, box-shadow 0.25s ease;
		}
		.chat-input-row input:focus { border-color: var(--mocha); box-shadow: 0 0 0 4px rgba(152, 116, 90, 0.18); }
		.chat-input-row input::placeholder { color: var(--text-faint); }
		.chat-send-btn {
			flex-shrink: 0;
			width: 42px;
			height: 42px;
			border-radius: 50%;
			border: none;
			background: var(--btn-bg);
			color: var(--btn-text);
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			transition: transform 0.2s var(--ease-spring);
		}
		.chat-send-btn:hover:not(:disabled) { transform: rotate(-12deg) scale(1.05); }
		.chat-send-btn:active:not(:disabled) { transform: scale(0.9); }
		.chat-send-btn:disabled { opacity: 0.6; cursor: not-allowed; }
		.chat-send-btn svg { width: 18px; height: 18px; }

		/* ---- Lipa / info boxes ----------------------------------------- */
		.lipa-box {
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 24px;
			width: 100%;
			max-width: 340px;
			padding: 22px 20px 20px;
			text-align: center;
			position: relative;
			box-shadow: 0 30px 60px -20px rgba(31, 18, 11, 0.5);
		}
		.lipa-box h3 { font-family: var(--serif); font-size: 18px; font-weight: 700; color: var(--coffee); }
		.lipa-box p { font-size: 12.5px; color: var(--text-dim); margin-top: 6px; }
		.lipa-box img {
			width: 100%;
			border-radius: 12px;
			border: 1px solid var(--line);
			margin-top: 14px;
		}

		.lipa-options {
			display: flex;
			flex-direction: column;
			gap: 10px;
			margin-top: 16px;
		}
		.lipa-option {
			width: 100%;
			padding: 13px 16px;
			border: 1.5px solid var(--line);
			border-radius: 12px;
			background: var(--surface-2);
			color: var(--coffee);
			font-size: 14px;
			font-weight: 700;
			cursor: pointer;
			text-align: center;
			transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s var(--ease-out);
		}
		.lipa-option:hover { border-color: var(--mocha); background: var(--latte); transform: translateX(3px); }
		.lipa-option:active { transform: scale(0.98); }

		.maintenance-icon, .info-icon {
			width: 58px;
			height: 58px;
			border-radius: 50%;
			background: var(--latte);
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0 auto 14px;
		}
		.maintenance-icon svg, .info-icon svg { width: 28px; height: 28px; color: var(--coffee); }
		.modal-overlay.show .maintenance-icon, .modal-overlay.show .info-icon { animation: pop 0.5s var(--ease-spring) 0.1s both; }
		.lipa-box h3 + p.msg-body { margin-top: 8px; }

		.success-icon {
			width: 66px;
			height: 66px;
			border-radius: 50%;
			background: linear-gradient(135deg, var(--mocha), var(--coffee));
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0 auto 14px;
		}
		.success-icon svg { width: 32px; height: 32px; }
		.success-icon svg path { stroke: var(--cream); stroke-dasharray: 22; stroke-dashoffset: 22; }
		/* badge pops, then the tick draws itself */
		.modal-overlay.show .success-icon { animation: pop 0.55s var(--ease-spring) 0.1s both, pulse-ring 2.4s ease-out 0.8s infinite; }
		.modal-overlay.show .success-icon svg path { animation: draw 0.45s ease-out 0.45s forwards; }
		.redirect-note { font-size: 11.5px; color: var(--text-faint); margin-top: 18px; }

		/* ---- Full-screen ad before the free trial ---------------------- */
		.ad-full {
			position: fixed;
			inset: 0;
			z-index: 2000;
			background: var(--espresso);
			color: var(--cream);
			overflow: hidden;
			animation: ad-full-in 0.45s var(--ease-out) both;
		}
		@keyframes ad-full-in { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: none; } }
		/* blurred copy fills the edges, so any ad shape fits without cropping */
		.ad-full-backdrop {
			position: absolute;
			inset: -40px;
			background-size: cover;
			background-position: center;
			filter: blur(28px) brightness(0.45);
		}
		.ad-full-media {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			object-fit: contain;
		}
		.ad-full-top {
			position: absolute;
			top: 0; left: 0; right: 0;
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: max(16px, env(safe-area-inset-top)) 16px 30px;
			background: linear-gradient(180deg, rgba(31, 18, 11, 0.65), transparent);
		}
		.ad-full-badge {
			font-size: 10.5px;
			font-weight: 800;
			letter-spacing: 1px;
			text-transform: uppercase;
			padding: 4px 10px;
			border-radius: 999px;
			background: rgba(235, 224, 210, 0.18);
			border: 1px solid rgba(235, 224, 210, 0.35);
		}
		.ad-full-timer {
			position: relative;
			width: 44px;
			height: 44px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 16px;
			font-weight: 800;
			border-radius: 50%;
			background: rgba(31, 18, 11, 0.55);
		}
		.ad-full-timer svg { position: absolute; inset: 0; transform: rotate(-90deg); }
		.ad-full-timer circle { fill: none; stroke-width: 3; }
		.ad-full-timer .track { stroke: rgba(235, 224, 210, 0.2); }
		.ad-full-timer .bar {
			stroke: var(--latte);
			stroke-linecap: round;
			stroke-dasharray: 100.5;
			transition: stroke-dashoffset 1s linear;
		}
		.ad-full-timer.done { animation: pop 0.4s var(--ease-spring) both; }
		.ad-full-sound {
			position: absolute;
			top: calc(max(16px, env(safe-area-inset-top)) + 56px);
			right: 16px;
			border: none;
			border-radius: 999px;
			padding: 7px 12px;
			font-size: 12px;
			font-weight: 700;
			color: var(--cream);
			background: rgba(31, 18, 11, 0.6);
			cursor: pointer;
		}
		.ad-full-bottom {
			position: absolute;
			left: 0; right: 0; bottom: 0;
			padding: 60px 20px max(22px, env(safe-area-inset-bottom));
			text-align: center;
			background: linear-gradient(0deg, rgba(31, 18, 11, 0.85) 30%, transparent);
			animation: rise 0.5s var(--ease-out) 0.3s both;
