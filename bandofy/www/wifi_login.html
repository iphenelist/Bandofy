<!DOCTYPE html>
<html lang="sw">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
	<title id="page-title">{{ site_label or "Wi-Fi" }} - Ungana Sasa</title>
	<style>
		:root {
			/* Fixed green / white / black brand palette. */
			--green: #16A34A;
			--green-dark: #15803D;
			--green-soft: #DCFCE7;
			--primary-blue: var(--green);
			--text-primary: #0A0A0A;
			--text-secondary: #404040;
			--primary-button-bg: var(--green);
			--primary-button-text: #FFFFFF;
			--glass-card-bg: #FFFFFF;
			--glass-inner-bg: #F5F5F5;

			--accent: var(--green);
			--accent-2: var(--green-dark);
			--glass: #FFFFFF;
			--glass-strong: var(--glass-inner-bg);
			--glass-border: #E5E5E5;
			--text: var(--text-primary);
			--text-dim: var(--text-secondary);
			--text-faint: #737373;
			--danger-bg: #FEF2F2;
			--danger-text: #B91C1C;
			--danger-border: #FECACA;
			--success-bg: var(--green-soft);
			--success-text: #166534;
			--success-border: #86EFAC;
		}
		* { box-sizing: border-box; margin: 0; padding: 0; }
		html, body { height: 100%; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			min-height: 100vh;
			display: flex;
			justify-content: center;
			/* bottom room so the stacked call/chat/lipa buttons never cover content */
			padding: 24px 14px 150px;
			color: var(--text);
			background: #FFFFFF;
		}
		/* Vue mount point (public/js/wifi_portal) -- stands in for .page as body's flex child */
		#portal { width: 100%; display: flex; justify-content: center; }
		.page { width: 100%; max-width: 430px; }

		/* Language toggle */
		.lang-toggle {
			display: flex;
			justify-content: center;
			margin-bottom: 14px;
		}
		.lang-toggle-inner {
			display: inline-flex;
			background: var(--glass);
			border: 1px solid var(--glass-border);
			border-radius: 999px;
			padding: 3px;
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
		}
		.lang-btn {
			border: none;
			background: transparent;
			color: var(--text-dim);
			font-size: 12px;
			font-weight: 700;
			letter-spacing: 0.4px;
			padding: 6px 14px;
			border-radius: 999px;
			cursor: pointer;
			transition: background 0.15s ease, color 0.15s ease;
		}
		.lang-btn.active { background: var(--green); color: #fff; }

		.card {
			background: var(--glass-card-bg);
			backdrop-filter: blur(15px);
			-webkit-backdrop-filter: blur(15px);
			border: 1px solid var(--glass-border);
			border-radius: 26px;
			padding: 28px 22px 22px;
			text-align: center;
			box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.12);
		}
		.hero-icon {
			width: 64px;
			height: 64px;
			margin: 0 auto 14px;
			border-radius: 50%;
			overflow: hidden;
			background: var(--primary-blue);
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow: 0 10px 26px rgba(22, 163, 74, 0.3);
		}
		.hero-icon svg { width: 30px; height: 30px; }
		.hero-icon img { width: 100%; height: 100%; object-fit: cover; }
		.card h1 { font-size: 20px; font-weight: 800; color: var(--text); }
		.card p.tagline { font-size: 12.5px; color: var(--text-dim); margin-top: 4px; }
		.card p.premium-tag { font-size: 11px; color: var(--text-faint); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.6px; }

		.steps {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 6px;
			margin: 18px 0 16px;
			font-size: 12px;
			font-weight: 700;
			color: var(--text);
			letter-spacing: 0.3px;
		}
		.steps .chevron { color: var(--text-faint); font-size: 11px; }

		/* Prominent voucher input, styled like the reference's single pill */
		.voucher-hero {
			text-align: left;
			margin-top: 6px;
		}
		.voucher-input-wrap {
			display: flex;
			align-items: center;
			gap: 10px;
			background: var(--glass-strong);
			border: 1.5px solid var(--glass-border);
			border-radius: 16px;
			padding: 14px 16px;
		}
		.voucher-input-wrap svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--primary-blue); }
		.voucher-input-wrap input {
			flex: 1;
			background: transparent;
			border: none;
			outline: none;
			color: var(--primary-blue);
			font-size: 15px;
			font-weight: 700;
			letter-spacing: 0.5px;
			text-transform: uppercase;
			min-width: 0;
		}
		.voucher-input-wrap input::placeholder {
			color: var(--text-faint);
			font-weight: 500;
			text-transform: none;
			letter-spacing: normal;
		}

		.btn-primary {
			width: 100%;
			margin-top: 12px;
			padding: 14px;
			border: none;
			border-radius: 14px;
			background: var(--primary-button-bg);
			color: var(--primary-button-text);
			font-size: 15px;
			font-weight: 800;
			cursor: pointer;
			box-shadow: 0 8px 20px rgba(22, 163, 74, 0.25);
		}
		.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

		.btn-secondary {
			width: 100%;
			margin-top: 10px;
			padding: 12px;
			border: 1.5px solid var(--glass-border);
			border-radius: 14px;
			background: transparent;
			color: var(--text-primary);
			font-size: 13.5px;
			font-weight: 700;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
		}
		.btn-secondary svg { width: 16px; height: 16px; }

		.pay-label {
			font-size: 11px;
			font-weight: 700;
			color: var(--text-faint);
			text-transform: uppercase;
			letter-spacing: 0.5px;
			margin: 18px 0 8px;
		}
		.pay-logos {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			justify-content: center;
		}
		.pay-logo {
			height: 34px;
			padding: 5px 12px;
			border: 1px solid var(--glass-border);
			border-radius: 10px;
			background: #FFFFFF;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.pay-logo img { max-height: 22px; max-width: 80px; object-fit: contain; }
		.pay-logo .pay-fallback {
			display: none;
			align-items: center;
			font-size: 10.5px;
			font-weight: 800;
			color: var(--text);
			white-space: nowrap;
		}

		.ad-card {
			margin-top: 16px;
			border: 1px solid var(--glass-border);
			border-radius: 18px;
			overflow: hidden;
			background: var(--glass);
		}
		.ad-image-wrap {
			display: flex;
			align-items: center;
			justify-content: center;
			height: 88px;
			background: var(--glass-strong);
			padding: 10px;
		}
		.ad-banner {
			display: block;
			max-width: 100%;
			max-height: 100%;
			width: auto;
			height: auto;
			object-fit: contain;
		}
		.ad-marquee {
			overflow: hidden;
			white-space: nowrap;
			border-top: 1px solid var(--glass-border);
			background: var(--green-soft);
			padding: 7px 0;
		}
		.ad-marquee-track {
			display: inline-flex;
			width: max-content;
			animation-name: ad-marquee-scroll;
			animation-timing-function: linear;
			animation-iteration-count: infinite;
		}
		.ad-marquee-item {
			display: inline-block;
			padding: 0 20px;
			font-size: 12px;
			font-weight: 600;
			color: var(--success-text);
		}
		@keyframes ad-marquee-scroll {
			from { transform: translateX(0); }
			to { transform: translateX(-50%); }
		}

		/* Carousel: every slide shares the same grid cell (stacked on top of
		   one another) so the container's height never jumps between ads,
		   and the active one is swapped purely via an opacity crossfade. */
		.ad-slides { display: grid; }
		.ad-slide {
			grid-area: 1 / 1;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.8s ease-in-out;
		}
		.ad-slide.active { opacity: 1; pointer-events: auto; }

		.ad-dots {
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 6px;
			padding: 9px 0;
			background: #FFFFFF;
			border-top: 1px solid var(--glass-border);
		}
		.ad-dot {
			width: 6px;
			height: 6px;
			border-radius: 50%;
			background: #D4D4D4;
			border: none;
			padding: 0;
			cursor: pointer;
			transition: width 0.15s ease, border-radius 0.15s ease, background 0.15s ease;
		}
		.ad-dot.active { width: 16px; border-radius: 4px; background: var(--green); }

		.section { margin-top: 22px; }

		.free-trial-card {
			display: flex;
			align-items: center;
			gap: 12px;
			background: var(--green-soft);
			border: 1.5px solid var(--success-border);
			border-radius: 18px;
			padding: 14px 16px;
			margin-bottom: 14px;
			text-align: left;
		}
		.free-trial-card.used {
			background: var(--glass);
			border-color: var(--glass-border);
		}
		.free-trial-icon {
			flex-shrink: 0;
			width: 40px;
			height: 40px;
			border-radius: 50%;
			background: var(--green);
			display: flex;
			align-items: center;
			justify-content: center;
			color: #fff;
		}
		.free-trial-card.used .free-trial-icon { background: var(--glass-strong); color: var(--text-dim); }
		.free-trial-icon svg { width: 20px; height: 20px; }
		.free-trial-text { flex: 1; min-width: 0; text-align: left; }
		.free-trial-title { font-size: 13.5px; font-weight: 800; color: var(--text); }
		.free-trial-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
		.free-trial-btn {
			flex-shrink: 0;
			border: none;
			border-radius: 12px;
			background: var(--green);
			color: #fff;
			font-size: 12.5px;
			font-weight: 800;
			padding: 10px 14px;
			cursor: pointer;
		}
		.free-trial-btn:disabled { opacity: 0.6; cursor: not-allowed; }

		.sabbath-card {
			background: linear-gradient(160deg, #fff8e7 0%, #fdeccf 55%, #f9dfc0 100%);
			border: 1.5px solid #f1cf94;
			border-radius: 20px;
			padding: 22px 18px 18px;
			margin-bottom: 14px;
			text-align: center;
			color: #4a3413;
			box-shadow: 0 8px 24px rgba(214, 158, 46, 0.18);
		}
		.sabbath-icon {
			width: 56px;
			height: 56px;
			margin: 0 auto 10px;
			border-radius: 50%;
			background: linear-gradient(135deg, #f6c453, #e8913a);
			color: #fff;
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow: 0 0 0 6px rgba(246, 196, 83, 0.25);
		}
		.sabbath-icon svg { width: 28px; height: 28px; }
		.sabbath-title { font-size: 19px; font-weight: 800; color: #7a4a0c; }
		.sabbath-verse {
			margin: 12px 4px 10px;
			font-size: 15px;
			font-style: italic;
			font-family: Georgia, "Times New Roman", serif;
			line-height: 1.45;
			color: #5c3d10;
		}
		.sabbath-verse cite {
			display: block;
			margin-top: 4px;
			font-size: 12px;
			font-style: normal;
			font-weight: 700;
			font-family: inherit;
			color: #a0671a;
		}
		.sabbath-body { font-size: 12.5px; line-height: 1.5; color: #5c4320; }
		.sabbath-connected {
			margin-top: 10px;
			font-size: 12px;
			font-weight: 700;
			color: #2f6b3a;
			background: rgba(255, 255, 255, 0.6);
			border-radius: 12px;
			padding: 8px 10px;
		}
		.sabbath-verse-small { margin-top: 10px; font-size: 10.5px; font-style: italic; color: #8a6a3a; }
		.free-trial-used-badge {
			flex-shrink: 0;
			font-size: 10.5px;
			font-weight: 800;
			color: var(--text-faint);
			background: var(--glass-strong);
			border: 1px solid var(--glass-border);
			border-radius: 999px;
			padding: 6px 12px;
			text-transform: uppercase;
			letter-spacing: 0.3px;
		}

		.section-card {
			background: var(--glass);
			border: 1px solid var(--glass-border);
			border-radius: 20px;
			padding: 16px 16px 14px;
			backdrop-filter: blur(18px);
			-webkit-backdrop-filter: blur(18px);
		}
		.section-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
			margin-bottom: 12px;
		}
		.section-header .title-group { display: flex; align-items: center; gap: 8px; }
		.section-header .badge {
			width: 26px;
			height: 26px;
			border-radius: 8px;
			background: var(--glass-strong);
			display: flex;
			align-items: center;
			justify-content: center;
			flex-shrink: 0;
		}
		.section-header .badge svg { width: 14px; height: 14px; color: var(--green); }
		.section-header h2 { font-size: 15px; font-weight: 800; color: var(--text); text-align: left; }
		.plans-chip {
			font-size: 10.5px;
			font-weight: 800;
			color: var(--text);
			background: var(--glass-strong);
			border: 1px solid var(--glass-border);
			border-radius: 999px;
			padding: 4px 10px;
			text-transform: uppercase;
			letter-spacing: 0.4px;
		}

		.group-title {
			font-size: 11px;
			font-weight: 700;
			color: var(--text-dim);
			text-transform: uppercase;
			letter-spacing: 0.5px;
			margin: 14px 0 8px;
			text-align: left;
		}
		.group-title:first-child { margin-top: 0; }

		.plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
		.package-card {
			background: var(--glass-strong);
			border: 1.5px solid var(--glass-border);
			border-radius: 16px;
			padding: 14px 12px;
			text-align: center;
			cursor: pointer;
			transition: border-color 0.15s ease, transform 0.1s ease;
		}
		.package-card:hover { border-color: var(--green); }
		.package-card:active { transform: scale(0.98); }
		.package-info { min-width: 0; }
		.package-name { font-size: 13.5px; font-weight: 800; color: var(--text-primary); }
		.package-meta { font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }
		.price-tag {
			display: inline-block;
			margin-top: 8px;
			padding: 4px 10px;
			border-radius: 999px;
			background: var(--primary-button-bg);
			color: var(--primary-button-text);
			font-size: 11px;
			font-weight: 800;
		}
		.buy-btn {
			display: block;
			width: 100%;
			margin-top: 10px;
			border: none;
			background: var(--primary-button-bg);
			color: var(--primary-button-text);
			font-size: 13px;
			font-weight: 800;
			padding: 9px 8px;
			border-radius: 10px;
			cursor: pointer;
		}
		.buy-btn:disabled { opacity: 0.6; cursor: not-allowed; }

		.empty-state {
			text-align: center;
			color: var(--text-dim);
			font-size: 13px;
			padding: 16px 10px;
			border: 1.5px dashed var(--glass-border);
			border-radius: 14px;
		}

		.msg {
			margin-top: 16px;
			padding: 12px 14px;
			border-radius: 12px;
			font-size: 13px;
			display: none;
		}
		.msg.show { display: block; }
		.msg.success { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
		.msg.error { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); }

		.no-site {
			text-align: center;
			color: var(--text-dim);
			font-size: 14px;
			padding: 30px 10px;
		}

		.footer-note {
			text-align: center;
			font-size: 11px;
			color: var(--text-faint);
			margin-top: 26px;
		}

		.modal-overlay {
			position: fixed;
			inset: 0;
			background: rgba(0, 0, 0, 0.5);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
			z-index: 1000;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.18s ease;
		}
		.modal-overlay.show { opacity: 1; pointer-events: auto; }
		.modal-box {
			background: #FFFFFF;
			border: 1px solid var(--glass-border);
			border-radius: 22px;
			width: 100%;
			max-width: 360px;
			padding: 24px 20px 20px;
			box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18);
			position: relative;
		}
		.modal-close {
			position: absolute;
			top: 12px;
			right: 12px;
			width: 28px;
			height: 28px;
			border-radius: 50%;
			background: var(--glass-strong);
			border: none;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			color: var(--text);
			font-size: 18px;
			line-height: 1;
		}
		.modal-pkg { text-align: center; margin-bottom: 18px; }
		.modal-pkg .label {
			font-size: 11px;
			font-weight: 700;
			color: var(--text-faint);
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}
		.modal-pkg .name { font-size: 17px; font-weight: 800; color: var(--text); margin-top: 4px; }
		.modal-pkg .meta { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
		.modal-box label.field-label {
			display: block;
			font-size: 12.5px;
			font-weight: 700;
			color: var(--text-dim);
			margin-bottom: 6px;
			text-align: left;
		}
		.phone-pill {
			display: flex;
			align-items: center;
			gap: 10px;
			background: var(--glass-strong);
			border: 1.5px solid var(--glass-border);
			border-radius: 14px;
			padding: 12px 16px;
		}
		.phone-pill svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--green); }
		.phone-pill input {
			flex: 1;
			background: transparent;
			border: none;
			outline: none;
			color: var(--text);
			font-size: 15px;
			font-weight: 600;
			min-width: 0;
		}
		.phone-pill input::placeholder { color: var(--text-faint); font-weight: 500; }
		.modal-hint {
			font-size: 11.5px;
			color: var(--text-dim);
			margin: 8px 0 16px;
			text-align: left;
		}
		.modal-submit {
			width: 100%;
			padding: 13px;
			border: none;
			border-radius: 14px;
			background: var(--primary-button-bg);
			color: var(--primary-button-text);
			font-size: 14.5px;
			font-weight: 800;
			cursor: pointer;
		}
		.modal-submit:disabled { opacity: 0.6; cursor: not-allowed; }
		.modal-msg {
			margin-top: 12px;
			padding: 10px 12px;
			border-radius: 10px;
			font-size: 12.5px;
			display: none;
		}
		.modal-msg.show { display: block; }
		.modal-msg.success { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
		.modal-msg.error { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); }
		.modal-info-text { font-size: 13px; color: var(--text-dim); line-height: 1.5; text-align: left; margin-top: 4px; }

		.fab-lipa {
			position: fixed;
			right: 18px;
			bottom: 18px;
			z-index: 900;
			display: flex;
			align-items: center;
			gap: 8px;
			background: var(--primary-button-bg);
			color: var(--primary-button-text);
			border: none;
			border-radius: 999px;
			padding: 13px 20px 13px 16px;
			font-size: 13.5px;
			font-weight: 800;
			box-shadow: 0 10px 24px rgba(22, 163, 74, 0.3);
			cursor: pointer;
		}
		.fab-lipa svg { width: 20px; height: 20px; flex-shrink: 0; }

		.fab-chat {
			position: fixed;
			left: 18px;
			bottom: 18px;
			z-index: 900;
			width: 52px;
			height: 52px;
			display: flex;
			align-items: center;
			justify-content: center;
			background: linear-gradient(135deg, var(--accent), var(--accent-2));
			color: #fff;
			border: none;
			border-radius: 50%;
			box-shadow: 0 10px 24px rgba(22, 163, 74, 0.3);
			cursor: pointer;
		}
		.fab-chat svg { width: 24px; height: 24px; }
		.fab-chat .chat-unread-dot {
			position: absolute;
			top: 2px;
			right: 2px;
			width: 12px;
			height: 12px;
			border-radius: 50%;
			background: #EF4444;
			border: 2px solid #FFFFFF;
			display: none;
		}
		.fab-chat .chat-unread-dot.show { display: block; }

		/* Call-for-help button, stacked directly above the chat button */
		.fab-call {
			position: fixed;
			left: 18px;
			bottom: 82px;
			z-index: 900;
			width: 52px;
			height: 52px;
			display: flex;
			align-items: center;
			justify-content: center;
			background: linear-gradient(135deg, var(--accent), var(--accent-2));
			color: #fff;
			border-radius: 50%;
			box-shadow: 0 10px 24px rgba(22, 163, 74, 0.3);
			text-decoration: none;
		}
		.fab-call svg { width: 22px; height: 22px; }

		.chat-box {
			background: #FFFFFF;
			border: 1px solid var(--glass-border);
			border-radius: 22px;
			width: 100%;
			max-width: 380px;
			height: min(560px, 80vh);
			padding: 0;
			position: relative;
			box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18);
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}
		.chat-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			padding: 16px 50px 14px 20px;
			border-bottom: 1px solid var(--glass-border);
		}
		.chat-header h3 { font-size: 15px; font-weight: 800; color: var(--text); }
		.chat-header p { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
		.chat-box .modal-close { top: 14px; right: 14px; }
		.chat-messages {
			flex: 1;
			overflow-y: auto;
			padding: 16px 16px 8px;
			display: flex;
			flex-direction: column;
			gap: 10px;
		}
		.chat-empty {
			text-align: center;
			color: var(--text-dim);
			font-size: 12.5px;
			margin: auto;
			padding: 20px;
		}
		.chat-bubble {
			max-width: 78%;
			padding: 9px 13px;
			border-radius: 14px;
			font-size: 13px;
			line-height: 1.4;
			word-break: break-word;
		}
		.chat-bubble.guest {
			align-self: flex-end;
			background: linear-gradient(135deg, var(--accent), var(--accent-2));
			color: #fff;
			border-bottom-right-radius: 4px;
		}
		.chat-bubble.admin {
			align-self: flex-start;
			background: var(--glass-strong);
			color: var(--text);
			border: 1px solid var(--glass-border);
			border-bottom-left-radius: 4px;
		}
		.chat-input-row {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 12px 14px;
			border-top: 1px solid var(--glass-border);
		}
		.chat-input-row input {
			flex: 1;
			background: var(--glass-strong);
			border: 1.5px solid var(--glass-border);
			border-radius: 999px;
			padding: 11px 16px;
			color: var(--text);
			font-size: 13.5px;
			outline: none;
			min-width: 0;
		}
		.chat-input-row input::placeholder { color: var(--text-faint); }
		.chat-send-btn {
			flex-shrink: 0;
			width: 42px;
			height: 42px;
			border-radius: 50%;
			border: none;
			background: var(--primary-button-bg);
			color: var(--primary-button-text);
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
		}
		.chat-send-btn:disabled { opacity: 0.6; cursor: not-allowed; }
		.chat-send-btn svg { width: 18px; height: 18px; }

		.lipa-box {
			background: #FFFFFF;
			border: 1px solid var(--glass-border);
			border-radius: 22px;
			width: 100%;
			max-width: 340px;
			padding: 22px 20px 20px;
			text-align: center;
			position: relative;
			box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18);
		}
		.lipa-box h3 { font-size: 16px; font-weight: 800; color: var(--text); }
		.lipa-box p { font-size: 12.5px; color: var(--text-dim); margin-top: 6px; }
		.lipa-box img {
			width: 100%;
			border-radius: 12px;
			border: 1px solid var(--glass-border);
			margin-top: 14px;
		}

		.lipa-options {
			display: flex;
			flex-direction: column;
			gap: 10px;
			margin-top: 16px;
		}
		.lipa-option {
			width: 100%;
			padding: 13px 16px;
			border: 1.5px solid var(--glass-border);
			border-radius: 12px;
			background: var(--glass-strong);
			color: var(--text);
			font-size: 14px;
			font-weight: 700;
			cursor: pointer;
			text-align: center;
		}
		.lipa-option:hover { border-color: var(--green); }

		.maintenance-icon, .info-icon {
			width: 58px;
			height: 58px;
			border-radius: 50%;
			background: rgba(251, 191, 36, 0.18);
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0 auto 14px;
		}
		.maintenance-icon svg, .info-icon svg { width: 28px; height: 28px; color: #fbbf24; }
		.lipa-box h3 + p.msg-body { margin-top: 8px; }

		.success-icon {
			width: 62px;
			height: 62px;
			border-radius: 50%;
			background: linear-gradient(135deg, var(--accent), var(--accent-2));
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0 auto 14px;
		}
		.success-icon svg { width: 30px; height: 30px; }
		.redirect-note { font-size: 11.5px; color: var(--text-faint); margin-top: 18px; }
	</style>
</head>
